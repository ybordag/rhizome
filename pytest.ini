[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: fast unit tests
    integration: database-backed integration tests
    graph: graph and orchestration tests
    telemetry: telemetry smoke tests
    live: live API tests that hit real provider endpoints (skip in CI)
    e2e: end-to-end tests requiring both Cambium (:8080) and Rhizome (:8001) running
